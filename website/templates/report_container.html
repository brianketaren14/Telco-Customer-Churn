<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETAIN// Evidently Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .report-frame-container {
      width: 100%;
      height: calc(100vh - 70px);
      border: none;
      position: relative;
      z-index: 1;
      padding: 0;
      margin: 0;
    }
    .report-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>

<body>

  <div class="grid-overlay"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">●</span>
      <span class="brand-name">RETAIN<span class="slash">//</span></span>
      <span class="brand-sub">CHURN RISK CONSOLE</span>
    </div>
    <nav class="topbar-nav">
      <a href="/" class="nav-link">Console</a>
      <a href="/report" class="nav-link active">Evidently Report</a>
    </nav>
    <div class="topbar-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="clock">REPORT ACTIVE</span>
    </div>
  </header>

  <div class="report-frame-container">
    <iframe class="report-iframe" src="/evidently-report"></iframe>
  </div>

  <script>
    const statusDot = document.getElementById('statusDot');
    statusDot.style.background = 'var(--signal-safe)';
    statusDot.style.boxShadow = '0 0 8px var(--signal-safe)';
  </script>
</body>

</html>
